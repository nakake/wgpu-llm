[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wgpu = "25"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
safetensors = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"

# workspace internal
wgpu-llm = { path = "crates/wgpu-llm" }

